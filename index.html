<body class="terminal-shell">
<span class="deco-corner deco-corner--tl" aria-hidden="true"></span>
<span class="deco-corner deco-corner--tr" aria-hidden="true"></span>
<span class="deco-corner deco-corner--bl" aria-hidden="true"></span>
<span class="deco-corner deco-corner--br" aria-hidden="true"></span>
<header class="site-status" aria-label="System status">
    <span class="status-glyph" aria-label="Lunar coordinate"><span class="status-glyph__text" aria-hidden="true">⟟ 04</span></span>
    <span class="status-glyph status-glyph--center" aria-label="Fourth Drive Transmission"><span class="terminal-readout" aria-hidden="true"><span class="terminal-readout__text"></span><span class="terminal-readout__cursor">▌</span></span></span>
    <span class="signal-status" aria-label="Lunar phase: waxing crescent"><i class="lunar-phase" aria-hidden="true">◐</i></span>
</header>
<main class="terminal-frame">
<div class="spacetime-grid" aria-hidden="true"></div>
<div class="gravity-well" aria-hidden="true">
    <span class="gravity-well__spokes"></span>
    <span class="gravity-well__ring"></span>

    <span class="gravity-well__ring"></span>
    <span class="gravity-well__ring"></span>
    <span class="gravity-well__ring"></span>
    <span class="gravity-well__ring"></span>
</div>
<div class="container">
    <div class="logo-orbit">
        <span class="frame-runner" aria-hidden="true"></span>
        <span class="frame-runner frame-runner--reverse" aria-hidden="true"></span>
        <div id="logo" title="Fourth Drive logo">
            <div class="logo-frame">
                <img src="/logo.svg" alt="Fourth Drive logo" decoding="async" fetchpriority="high"/>
            </div>
        </div>
    </div>
    <div class="social-panel">
        <svg class="panel-ornament" viewBox="0 0 48 20" width="48" height="20" aria-hidden="true">
            <rect x="8" y="4" width="32" height="12"/>
            <path class="panel-ornament__tick" d="M2 10 L15 10 M33 10 L46 10"/>
            <path class="panel-ornament__gem-outer" d="M24 3 L30 10 L24 17 L18 10 Z"/>
            <path class="panel-ornament__gem-inner" d="M24 7 L27 10 L24 13 L21 10 Z"/>
        </svg>
        <div class="social">
        <a href="https://ffm.bio/fourthdrive" target="_blank" rel="noopener noreferrer" title="feature.fm"
           aria-label="feature.fm" data-label="MORE">
            <svg width="256" height="256" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
                <use href="/icons.svg#play"/>
            </svg>
        </a>
        <a href="https://www.instagram.com/fourthdrive" target="_blank" rel="noopener noreferrer" title="Instagram"
           aria-label="Instagram" data-label="INSTAGRAM">
            <svg width="256" height="256" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
                <use href="/icons.svg#instagram"/>
            </svg>
        </a>
        <a href="https://fourthdrive.gumroad.com" target="_blank" rel="noopener noreferrer" title="gumroad"
           aria-label="gumroad" data-label="GUMROAD">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <use href="/icons.svg#gumroad"/>
            </svg>
        </a>
        </div>
    </div>
    <section id="spotify-container" aria-label="Now playing">
        <svg class="panel-ornament" viewBox="0 0 48 20" width="48" height="20" aria-hidden="true">
            <rect x="8" y="4" width="32" height="12"/>
            <path class="panel-ornament__tick" d="M2 10 L15 10 M33 10 L46 10"/>
            <path class="panel-ornament__gem-outer" d="M24 3 L30 10 L24 17 L18 10 Z"/>
            <path class="panel-ornament__gem-inner" d="M24 7 L27 10 L24 13 L21 10 Z"/>
        </svg>
        <div class="player-header">
            <span>&gt; NOW PLAYING</span>
        </div>
        <div class="player-viewport">

                <div class="spinner-ring"></div>
            </div>
            <div class="player-scanline" aria-hidden="true"></div>

            <div class="spotify-tint" aria-hidden="true"></div>
        </div>
    </section>
